[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sembl"
version = "0.1.19"
description = "A deterministic accountability gate for AI coding agents — verify a diff stayed in declared bounds and didn't fake its results"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "speedvibecode", email = "f20220620@hyderabad.bits-pilani.ac.in" },
    { name = "Siddharth Totla", email = "totlasiddharth@gmail.com" },
]
keywords = [
    "ai",
    "coding-agents",
    "work-order",
    "code-review",
    "graph",
    "llm",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://sembl.vercel.app"
Repository = "https://github.com/speedvibecode/sembl"
Issues = "https://github.com/speedvibecode/sembl/issues"

[project.optional-dependencies]
mcp = [
    "mcp>=1.2.0",
]
graph = [
    "graphifyy>=0.8.0",
]
crg = [
    "code-review-graph",
]
graph-pipeline = [
    "graphifyy>=0.8.0",
    "code-review-graph",
]

[project.scripts]
sembl = "sembl.cli:main"
sembl-mcp = "sembl.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sembl*"]
