name: Publish to PyPI

# Runs when you publish a GitHub Release (Releases -> Draft a new release ->
# pick a tag like v0.1.2 -> Publish). The release tag MUST match the version in
# pyproject.toml, or the build step fails with a clear message.
#
# Publishing uses PyPI Trusted Publishing (OIDC): no API token is stored
# anywhere. PyPI trusts this repo + workflow directly. See README "Releasing".

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify release tag matches pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "release tag: $TAG | pyproject version: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Release tag '$TAG' does not match pyproject version '$VER'. Bump the version (pyproject.toml, sembl/__init__.py, sembl/cli.py) and create a matching tag."
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload built distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC); no token needed
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
