name: Publish dev build to TestPyPI

# On every push to master (code changes), build a uniquely-versioned dev build
# (e.g. 0.1.2.dev7) and publish it to TestPyPI. Testers install the latest with:
#
#   pip install --pre -i https://test.pypi.org/simple/ \
#     --extra-index-url https://pypi.org/simple/ sembl
#
# Uses TestPyPI Trusted Publishing (OIDC) - no stored token. The base version
# comes from pyproject.toml; the unique .devN suffix is stamped in CI only, so
# nothing is committed and version numbers never collide.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    name: Build dev distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stamp a unique dev version
        run: |
          BASE="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          DEV="${BASE}.dev${{ github.run_number }}"
          echo "Stamping version $DEV"
          python - "$DEV" <<'PY'
          import re, sys, pathlib
          dev = sys.argv[1]
          p = pathlib.Path("pyproject.toml")
          s = p.read_text()
          s = re.sub(r'(?m)^version = "[^"]+"', f'version = "{dev}"', s, count=1)
          p.write_text(s)
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload built distribution
        uses: actions/upload-artifact@v4
        with:
          name: dist-testpypi
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for Trusted Publishing (OIDC); no token needed
    steps:
      - name: Download built distribution
        uses: actions/download-artifact@v4
        with:
          name: dist-testpypi
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
