<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sembl Reset</title>
    <style>
      :root {
        color-scheme: light;
        background: #f7f4ed;
        color: #161616;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100% - 48px));
      }

      p {
        color: #4b4b4b;
        font-size: 18px;
        line-height: 1.6;
        margin: 0;
      }

      h1 {
        font-size: clamp(42px, 8vw, 84px);
        line-height: 0.95;
        letter-spacing: 0;
        margin: 0 0 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sembl is being reset.</h1>
      <p>
        The previous build has been taken down so the project can restart from a
        clean foundation.
      </p>
    </main>
  </body>
</html>
